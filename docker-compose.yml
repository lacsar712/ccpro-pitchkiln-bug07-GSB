services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pitchkiln
      POSTGRES_USER: pitchkiln
      POSTGRES_PASSWORD: pitchkiln
    ports:
      - "6650:5432"
    volumes:
      - pitchkiln_bug07_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchkiln -d pitchkiln"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s

  web:
    build: .
    ports:
      - "5250:4710"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pitchkiln
      POSTGRES_USER: pitchkiln
      POSTGRES_PASSWORD: pitchkiln
      CSRF_TRUSTED_ORIGINS: "http://localhost:5250,http://127.0.0.1:5250"
      USE_GUNICORN: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pitchkiln_bug07_pg:
